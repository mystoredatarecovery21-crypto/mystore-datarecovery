<!DOCTYPE html>
<html lang="ar" dir="rtl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYSTORE DATARECOVERY | لوحة التحكم والإدارة</title>

    <!-- Google Fonts: Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { DEFAULT: '#0f172a', dark: '#070d19', light: '#1e293b' },
                        techblue: { DEFAULT: '#2563eb', dark: '#1d4ed8' },
                        'cyan-neon': { DEFAULT: '#06b6d4', bright: '#00d2ff' }
                    },
                    fontFamily: { cairo: ['Cairo', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="antialiased bg-slate-950 text-slate-100 min-h-screen font-['Cairo',sans-serif]">

    <!-- LOGIN SCREEN -->
    <div id="admin-login-screen" class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 text-white p-8 rounded-3xl max-w-md w-full space-y-6 shadow-2xl">
            <div class="text-center space-y-3">
                <div class="w-16 h-16 rounded-2xl bg-cyan-500/20 text-cyan-400 flex items-center justify-center mx-auto text-3xl border border-cyan-500/30">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h2 class="text-2xl font-extrabold text-white">لوحة تحكم MYSTORE</h2>
                <p class="text-xs text-slate-400">3 ميدان سفنكس، العجوزة، الجيزة</p>
            </div>

            <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">كلمة المرور:</label>
                    <input type="password" id="admin-pass-input" placeholder="أدخل كلمة المرور..." 
                           class="w-full bg-slate-950 border border-slate-700 rounded-xl py-3 px-4 text-sm text-center font-bold outline-none focus:border-cyan-400 text-cyan-300" required>
                    <p class="text-[11px] text-slate-500 mt-2 text-center">كلمة السر الافتراضية: <strong class="text-cyan-300 font-mono">admin123</strong></p>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-cyan-500 hover:brightness-110 text-white font-extrabold py-3.5 rounded-xl text-xs shadow-lg transition-all">
                    تسجيل الدخول للوحة التحكم
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN ADMIN DASHBOARD -->
    <div id="admin-main-wrapper" class="hidden">
        <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-cyan-500 flex items-center justify-center shadow-lg">
                        <i class="fa-solid fa-hard-drive text-white text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-lg font-black text-white">MYSTORE ADMIN</h1>
                        <p class="text-[10px] text-slate-400">فرع العجوزة، الجيزة</p>
                    </div>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="openNewOrderModal()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-1.5 shadow">
                        <i class="fa-solid fa-plus"></i> طلب جديد
                    </button>
                    <button onclick="handleAdminLogout()" class="bg-red-900/30 text-red-300 p-2.5 rounded-xl text-xs" title="خروج">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
            <!-- Tabs Navigation -->
            <div class="flex flex-wrap gap-2 border-b border-slate-800 pb-3">
                <button onclick="switchAdminTab('orders')" id="tab-orders-btn" class="admin-tab active bg-blue-600 text-white font-bold px-5 py-2.5 rounded-xl text-xs transition-all">
                    <i class="fa-solid fa-list-check ml-1.5"></i> جدول الطلبات والأجهزة
                </button>
                <button onclick="switchAdminTab('inquiries')" id="tab-inquiries-btn" class="admin-tab bg-slate-900 text-slate-400 font-bold px-5 py-2.5 rounded-xl text-xs transition-all">
                    <i class="fa-solid fa-comments ml-1.5"></i> استفسارات العملاء
                </button>
                <button onclick="switchAdminTab('settings')" id="tab-settings-btn" class="admin-tab bg-slate-900 text-slate-400 font-bold px-5 py-2.5 rounded-xl text-xs transition-all">
                    <i class="fa-solid fa-key ml-1.5"></i> إعدادات وتغيير كلمة المرور
                </button>
            </div>

            <!-- ORDERS TAB -->
            <div id="admin-orders-tab" class="space-y-4">
                <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-x-auto shadow-xl">
                    <table class="w-full text-right text-xs">
                        <thead class="bg-slate-950 text-slate-400 font-bold border-b border-slate-800">
                            <tr>
                                <th class="p-4">كود التتبع</th>
                                <th class="p-4">اسم العميل والهاتف</th>
                                <th class="p-4">نوع الجهاز</th>
                                <th class="p-4">الحالة</th>
                                <th class="p-4">نسبة الإنجاز</th>
                                <th class="p-4">التكلفة</th>
                                <th class="p-4 text-center">إجراءات وطباعة</th>
                            </tr>
                        </thead>
                        <tbody id="admin-orders-table-body" class="divide-y divide-slate-800 text-slate-200"></tbody>
                    </table>
                </div>
            </div>

            <!-- INQUIRIES TAB -->
            <div id="admin-inquiries-tab" class="hidden space-y-4">
                <div class="bg-slate-900 rounded-2xl border border-slate-800 p-6 space-y-4">
                    <h3 class="text-base font-bold text-white">الرسائل والاستفسارات الواردة</h3>
                    <div id="admin-inquiries-list" class="space-y-3"></div>
                </div>
            </div>

            <!-- SETTINGS & PASSWORD CHANGE TAB -->
            <div id="admin-settings-tab" class="hidden space-y-6">
                <div class="bg-slate-900 rounded-2xl border border-slate-800 p-6 space-y-4 max-w-lg">
                    <h3 class="text-base font-bold text-white border-b border-slate-800 pb-3">
                        <i class="fa-solid fa-key text-cyan-400 ml-2"></i> تغيير كلمة مرور لوحة التحكم
                    </h3>
                    <form onsubmit="handleChangePassword(event)" class="space-y-4 text-xs">
                        <div>
                            <label class="block font-bold text-slate-300 mb-1">كلمة المرور الحالية:</label>
                            <input type="password" id="pass-current" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white outline-none" required>
                        </div>
                        <div>
                            <label class="block font-bold text-slate-300 mb-1">كلمة المرور الجديدة:</label>
                            <input type="password" id="pass-new" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white outline-none" required>
                        </div>
                        <div>
                            <label class="block font-bold text-slate-300 mb-1">تأكيد كلمة المرور الجديدة:</label>
                            <input type="password" id="pass-confirm" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white outline-none" required>
                        </div>
                        <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold px-6 py-3 rounded-xl shadow-lg">
                            حفظ وتحديث كلمة المرور
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <!-- ORDER MODAL -->
    <div id="order-form-modal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 text-white p-6 rounded-3xl max-w-xl w-full space-y-4 shadow-2xl">
            <h3 class="text-lg font-bold" id="order-modal-title">إنشاء طلب جديد</h3>
            <form onsubmit="handleSaveOrder(event)" class="space-y-3 text-xs">
                <input type="hidden" id="modal-order-key">
                <div class="grid sm:grid-cols-2 gap-3">
                    <input type="text" id="modal-order-code" placeholder="كود التتبع MY-2026-101" class="bg-slate-950 border border-slate-700 rounded-xl p-3 text-cyan-300 font-bold" required>
                    <input type="text" id="modal-client-name" placeholder="اسم العميل" class="bg-slate-950 border border-slate-700 rounded-xl p-3 text-white" required>
                </div>
                <div class="grid sm:grid-cols-2 gap-3">
                    <input type="text" id="modal-client-phone" placeholder="الهاتف" class="bg-slate-950 border border-slate-700 rounded-xl p-3 text-white" required>
                    <input type="text" id="modal-device-type" placeholder="نوع الجهاز (مثال: HDD WD 2TB)" class="bg-slate-950 border border-slate-700 rounded-xl p-3 text-white" required>
                </div>
                <div class="grid sm:grid-cols-3 gap-3">
                    <select id="modal-order-status" class="bg-slate-950 border border-slate-700 rounded-xl p-3 text-white font-bold">
                        <option value="inspection">قيد الفحص</option>
                        <option value="in_progress">جاري العمل</option>
                        <option value="ready">جاهز للتسليم</option>
                        <option value="completed">مكتمل</option>
                    </select>
                    <input type="number" id="modal-progress" placeholder="النسبة %" class="bg-slate-950 border border-slate-700 rounded-xl p-3 text-white" required>
                    <input type="text" id="modal-cost" placeholder="التكلفة (مثال: 1200 ج.م)" class="bg-slate-950 border border-slate-700 rounded-xl p-3 text-white" required>
                </div>
                <textarea id="modal-tech-report" rows="2" placeholder="التقرير الفني للعميل..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-white"></textarea>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeOrderModal()" class="px-4 py-2 bg-slate-800 rounded-xl">إلغاء</button>
                    <button type="submit" class="px-6 py-2 bg-cyan-600 rounded-xl font-bold">حفظ الطلب</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Logic for Realtime Database -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, push, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBz2WXbr5h9_eo0OgEoKoxAyZCD3pRE-gA",
            authDomain: "mystore-data-recovery-egypt.firebaseapp.com",
            databaseURL: "https://mystore-data-recovery-egypt-default-rtdb.firebaseio.com",
            projectId: "mystore-data-recovery-egypt",
            storageBucket: "mystore-data-recovery-egypt.firebasestorage.app",
            messagingSenderId: "1039795080426",
            appId: "1:1039795080426:web:da2d889edbe768d58c9b93",
            measurementId: "G-6KTXQDDTCM"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let ordersData = {};
        let inquiriesData = {};
        let adminPass = localStorage.getItem('mystore_admin_pass') || 'admin123';

        onValue(ref(db, 'orders'), (snapshot) => {
            ordersData = snapshot.val() || {};
            renderOrders();
        });

        onValue(ref(db, 'inquiries'), (snapshot) => {
            inquiriesData = snapshot.val() || {};
            renderInquiries();
        });

        window.handleAdminLogin = (e) => {
            e.preventDefault();
            const pass = document.getElementById('admin-pass-input').value;
            if (pass === adminPass) {
                document.getElementById('admin-login-screen').classList.add('hidden');
                document.getElementById('admin-main-wrapper').classList.remove('hidden');
            } else {
                alert('كلمة المرور غير صحيحة! كلمة السر الافتراضية هي: admin123');
            }
        };

        window.handleAdminLogout = () => {
            document.getElementById('admin-main-wrapper').classList.add('hidden');
            document.getElementById('admin-login-screen').classList.remove('hidden');
            document.getElementById('admin-pass-input').value = '';
        };

        window.handleChangePassword = (e) => {
            e.preventDefault();
            const curr = document.getElementById('pass-current').value;
            const newP = document.getElementById('pass-new').value;
            const conf = document.getElementById('pass-confirm').value;

            if (curr !== adminPass) {
                alert('كلمة المرور الحالية غير صحيحة!');
                return;
            }
            if (newP !== conf) {
                alert('كلمة المرور الجديدة غير متطابقة!');
                return;
            }

            adminPass = newP;
            localStorage.setItem('mystore_admin_pass', newP);
            alert('تم تغيير كلمة المرور بنجاح!');
            e.target.reset();
        };

        function renderOrders() {
            const tbody = document.getElementById('admin-orders-table-body');
            if (!tbody) return;
            const keys = Object.keys(ordersData);
            if (keys.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center p-6 text-slate-500">لا توجد طلبات حالياً</td></tr>`;
                return;
            }
            tbody.innerHTML = keys.map(key => {
                const o = ordersData[key];
                return `
                    <tr class="hover:bg-slate-800/40">
                        <td class="p-4 font-mono font-bold text-cyan-300">${o.code || ''}</td>
                        <td class="p-4">${o.clientName || ''}<br><span class="text-[10px] text-slate-400">${o.clientPhone || ''}</span></td>
                        <td class="p-4">${o.deviceType || ''}</td>
                        <td class="p-4"><span class="bg-blue-500/20 text-blue-300 px-2 py-0.5 rounded">${o.status || 'inspection'}</span></td>
                        <td class="p-4">${o.progress || 0}%</td>
                        <td class="p-4 font-bold text-emerald-400">${o.cost || '0 ج.م'}</td>
                        <td class="p-4 text-center space-x-1 space-x-reverse">
                            <button onclick="printReceipt('${key}')" class="p-1.5 bg-slate-800 text-amber-300 rounded" title="طباعة"><i class="fa-solid fa-print"></i></button>
                            <button onclick="editOrder('${key}')" class="p-1.5 bg-slate-800 text-cyan-300 rounded" title="تعديل"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteOrder('${key}')" class="p-1.5 bg-red-900/30 text-red-300 rounded" title="حذف"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function renderInquiries() {
            const list = document.getElementById('admin-inquiries-list');
            if (!list) return;
            const keys = Object.keys(inquiriesData);
            if (keys.length === 0) {
                list.innerHTML = '<p class="text-slate-500 text-xs">لا توجد رسائل حالياً</p>';
                return;
            }
            list.innerHTML = keys.map(key => {
                const i = inquiriesData[key];
                return `
                    <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
                        <div><strong>${i.name || ''} (${i.phone || ''})</strong>: ${i.notes || ''}</div>
                        <button onclick="deleteInquiry('${key}')" class="text-red-400"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            }).join('');
        }

        window.openNewOrderModal = () => {
            document.getElementById('modal-order-key').value = '';
            document.getElementById('modal-order-code').value = 'MY-2026-' + Math.floor(100 + Math.random() * 900);
            document.getElementById('modal-client-name').value = '';
            document.getElementById('modal-client-phone').value = '';
            document.getElementById('modal-device-type').value = '';
            document.getElementById('modal-progress').value = '0';
            document.getElementById('modal-cost').value = '1000 ج.م';
            document.getElementById('modal-tech-report').value = 'جاري الفحص...';
            document.getElementById('order-form-modal').classList.remove('hidden');
        };

        window.closeOrderModal = () => document.getElementById('order-form-modal').classList.add('hidden');

        window.handleSaveOrder = async (e) => {
            e.preventDefault();
            const key = document.getElementById('modal-order-key').value;
            const data = {
                code: document.getElementById('modal-order-code').value.toUpperCase(),
                clientName: document.getElementById('modal-client-name').value,
                clientPhone: document.getElementById('modal-client-phone').value,
                deviceType: document.getElementById('modal-device-type').value,
                status: document.getElementById('modal-order-status').value,
                progress: parseInt(document.getElementById('modal-progress').value) || 0,
                cost: document.getElementById('modal-cost').value,
                techReport: document.getElementById('modal-tech-report').value
            };

            try {
                if (key) {
                    await update(ref(db, 'orders/' + key), data);
                } else {
                    await push(ref(db, 'orders'), data);
                }
                closeOrderModal();
                alert('تم حفظ الطلب بنجاح!');
            } catch (err) {
                alert('حدث خطأ أثناء الحفظ.');
            }
        };

        window.editOrder = (key) => {
            const o = ordersData[key];
            if (!o) return;
            document.getElementById('modal-order-key').value = key;
            document.getElementById('modal-order-code').value = o.code || '';
            document.getElementById('modal-client-name').value = o.clientName || '';
            document.getElementById('modal-client-phone').value = o.clientPhone || '';
            document.getElementById('modal-device-type').value = o.deviceType || '';
            document.getElementById('modal-order-status').value = o.status || 'inspection';
            document.getElementById('modal-progress').value = o.progress || 0;
            document.getElementById('modal-cost').value = o.cost || '';
            document.getElementById('modal-tech-report').value = o.techReport || '';
            document.getElementById('order-form-modal').classList.remove('hidden');
        };

        window.deleteOrder = (key) => {
            if (confirm('هل أنت متأكد من حذف هذا الطلب؟')) {
                remove(ref(db, 'orders/' + key));
            }
        };

        window.deleteInquiry = (key) => {
            remove(ref(db, 'inquiries/' + key));
        };

        window.printReceipt = (key) => {
            const o = ordersData[key];
            if (!o) return;
            const w = window.open('', '_blank');
            w.document.write(`
                <html dir="rtl"><head><title>إيصال - ${o.code}</title><style>body{font-family:Cairo,sans-serif;padding:30px;line-height:1.6;}</style></head>
                <body>
                    <h2>MYSTORE DATARECOVERY EGYPT</h2>
                    <p><strong>العنوان الرئيسي:</strong> 3 ميدان سفنكس، الحويشية، العجوزة، محافظة الجيزة</p>
                    <hr>
                    <p><strong>كود التتبع:</strong> ${o.code}</p>
                    <p><strong>العميل:</strong> ${o.clientName} (${o.clientPhone})</p>
                    <p><strong>الجهاز:</strong> ${o.deviceType}</p>
                    <p><strong>التكلفة المحددة:</strong> ${o.cost}</p>
                    <p><strong>الحالة:</strong> ${o.status}</p>
                </body></html>
            `);
            w.document.close();
            w.print();
        };

        window.switchAdminTab = (tab) => {
            document.querySelectorAll('.admin-tab').forEach(b => { b.classList.remove('bg-blue-600', 'text-white'); b.classList.add('bg-slate-900', 'text-slate-400'); });
            document.getElementById('admin-orders-tab').classList.add('hidden');
            document.getElementById('admin-inquiries-tab').classList.add('hidden');
            document.getElementById('admin-settings-tab').classList.add('hidden');

            if (tab === 'orders') { document.getElementById('tab-orders-btn').classList.add('bg-blue-600', 'text-white'); document.getElementById('admin-orders-tab').classList.remove('hidden'); }
            if (tab === 'inquiries') { document.getElementById('tab-inquiries-btn').classList.add('bg-blue-600', 'text-white'); document.getElementById('admin-inquiries-tab').classList.remove('hidden'); }
            if (tab === 'settings') { document.getElementById('tab-settings-btn').classList.add('bg-blue-600', 'text-white'); document.getElementById('admin-settings-tab').classList.remove('hidden'); }
        };
    </script>
</body>
</html>
